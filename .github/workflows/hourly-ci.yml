name: Hourly Self-Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  self-check:
    name: Build, Test and Compose Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run auto-check
        id: auto
        run: |
          chmod +x scripts/auto-check.sh
          ./scripts/auto-check.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-check-report
          path: docs/auto-check-latest.md

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "## Hourly Self-Check Failed",
              "",
              "See the failed run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "",
              "Check `docs/auto-check-latest.md` in the run artifacts and the workflow log."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[auto-check] Failed ${new Date().toISOString()}`,
              body
            });
