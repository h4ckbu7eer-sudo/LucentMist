name: Release Image Verification

on:
  workflow_dispatch:
    inputs:
      image:
        description: Published GHCR image to verify
        required: true
        default: ghcr.io/h4ckbu7eer-sudo/lucentmist:0.9.8
        type: string
      expected_manifest_digest:
        description: Expected immutable manifest digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  pull-run-health:
    name: Pull, run, and check health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        env:
          IMAGE: ${{ inputs.image }}
        run: docker pull "$IMAGE"

      - name: Record immutable digest
        env:
          IMAGE: ${{ inputs.image }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
        run: |
          repo_digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          actual_manifest_digest="${repo_digest##*@}"
          if [ "$actual_manifest_digest" != "$EXPECTED_MANIFEST_DIGEST" ]; then
            echo "Manifest digest mismatch: expected $EXPECTED_MANIFEST_DIGEST, got $actual_manifest_digest" >&2
            exit 1
          fi

          echo "Pulled image: $repo_digest"
          echo "## Release image verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pulled manifest digest: \`$actual_manifest_digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest comparison: matched the expected release digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Start published API image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker run --detach \
            --name lucentmist-release-verification \
            --publish 127.0.0.1:5050:5050 \
            --env LMIST_API_TOKEN=release-verification-token \
            "$IMAGE"

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if response=$(curl --fail --silent --show-error http://127.0.0.1:5050/api/v1/health); then
              echo "Health response: $response"
              echo "- Health endpoint: HTTP 200" >> "$GITHUB_STEP_SUMMARY"
              echo "- Response: \`$response\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done

          echo "Health endpoint did not return HTTP 200 within 120 seconds." >&2
          docker logs lucentmist-release-verification >&2 || true
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs lucentmist-release-verification || true

      - name: Remove verification container
        if: always()
        run: docker rm --force lucentmist-release-verification || true
