server {
    listen 443 ssl default_server;
    server_name validation-tls.local;
    server_tokens off;

    ssl_certificate /validation/cert.pem;
    ssl_certificate_key /validation/key.pem;

    location / {
        default_type text/plain;
        return 200 "LucentMist controlled TLS target\n";
    }
}

