version: "3.8"

services:
  # ============================================
  # LucentMist API 服务
  # ============================================
  lucentmist:
    build:
      context: .
      dockerfile: Dockerfile
    image: lucentmist:0.7.0
    container_name: lucentmist-api
    ports:
      - "5050:5050"
    volumes:
      - ./config:/app/config:ro        # 配置文件（只读）
      - lucentmist-data:/app/data      # SQLite 数据
      - lucentmist-logs:/app/logs      # 日志
    environment:
      - LMIST_LLM_PROVIDER=${LMIST_LLM_PROVIDER:-ollama}
      - LMIST_LLM_MODEL=${LMIST_LLM_MODEL:-qwen2.5:7b}
      - LMIST_LLM_ENDPOINT=${LMIST_LLM_ENDPOINT:-http://host.docker.internal:11434}
      - LMIST_LLM_APIKEY=${LMIST_LLM_APIKEY:-}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - lucentmist-net

  # ============================================
  # LucentMist Web 服务
  # ============================================
  lucentmist-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lucentmist:0.7.0
    container_name: lucentmist-web
    ports:
      - "5051:5051"
    volumes:
      - lucentmist-data:/app/data
      - lucentmist-logs:/app/logs
    command: ["dotnet", "web/LucentMist.Web.dll", "5051"]
    depends_on:
      lucentmist:
        condition: service_started
    restart: unless-stopped
    networks:
      - lucentmist-net

  # ============================================
  # Redis 缓存（可选）
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: lucentmist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - lucentmist-net

# ============================================
# 持久化卷
# ============================================
volumes:
  lucentmist-data:
    driver: local
  lucentmist-logs:
    driver: local
  redis-data:
    driver: local

# ============================================
# 网络
# ============================================
networks:
  lucentmist-net:
    driver: bridge
