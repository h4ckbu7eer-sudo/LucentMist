services:
  # ============================================
  # LucentMist API 服务
  # ============================================
  lucentmist:
    build:
      context: .
      dockerfile: Dockerfile
    image: lucentmist:0.9.6
    container_name: lucentmist-api
    ports:
      - "5050:5050"
    cap_add:
      - NET_RAW
    volumes:
      - ./config:/app/config:ro        # 配置文件（只读）
      - lucentmist-data:/app/data      # SQLite 数据
      - lucentmist-logs:/app/logs      # 日志
    environment:
      - LMIST_LLM_PROVIDER=${LMIST_LLM_PROVIDER:-ollama}
      - LMIST_LLM_MODEL=${LMIST_LLM_MODEL:-qwen2.5:7b}
      - LMIST_LLM_ENDPOINT=${LMIST_LLM_ENDPOINT:-http://host.docker.internal:11434}
      - LMIST_LLM_APIKEY=${LMIST_LLM_APIKEY:-}
      - LMIST_CVE_EXTERNAL=${LMIST_CVE_EXTERNAL:-true}
      - LMIST_BIND_ADDRESS=0.0.0.0
      - LMIST_API_TOKEN=${LMIST_API_TOKEN:-}
      - LMIST_DB=/app/data/lucentmist.db
      - LMIST_LOG_FILE=logs/lucentmist-api.log
      - LMIST_MAX_CONNECTIONS=${LMIST_MAX_CONNECTIONS:-512}
      - LMIST_RETENTION_DAYS=${LMIST_RETENTION_DAYS:-90}
      - LMIST_CLEANUP_HOURS=${LMIST_CLEANUP_HOURS:-24}
      - LMIST_DB_VACUUM=${LMIST_DB_VACUUM:-0}
      - LMIST_DB_MAINTENANCE_OWNER=api
    restart: unless-stopped
    networks:
      - lucentmist-net

  # ============================================
  # LucentMist Web 服务
  # ============================================
  lucentmist-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lucentmist:0.9.6
    container_name: lucentmist-web
    ports:
      - "5051:5051"
    cap_add:
      - NET_RAW
    volumes:
      - lucentmist-data:/app/data
      - lucentmist-logs:/app/logs
    environment:
      - LMIST_API_URL=http://lucentmist:5050
      - LMIST_CVE_EXTERNAL=${LMIST_CVE_EXTERNAL:-true}
      - LMIST_API_TOKEN=${LMIST_API_TOKEN:-}
      - LMIST_WEB_BIND=0.0.0.0
      - LMIST_WEB_USER=${LMIST_WEB_USER:-}
      - LMIST_WEB_PASSWORD=${LMIST_WEB_PASSWORD:-}
      - LMIST_DB=/app/data/lucentmist.db
      - LMIST_LOG_FILE=logs/lucentmist-web.log
      - LMIST_MAX_CONNECTIONS=${LMIST_MAX_CONNECTIONS:-512}
      - LMIST_RETENTION_DAYS=${LMIST_RETENTION_DAYS:-90}
      - LMIST_CLEANUP_HOURS=${LMIST_CLEANUP_HOURS:-24}
      - LMIST_DB_VACUUM=${LMIST_DB_VACUUM:-0}
      - LMIST_DB_MAINTENANCE_OWNER=api
    command: ["dotnet", "web/LucentMist.Web.dll", "5051"]
    depends_on:
      lucentmist:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lucentmist-net

# ============================================
# 持久化卷
# ============================================
volumes:
  lucentmist-data:
    driver: local
  lucentmist-logs:
    driver: local

# ============================================
# 网络
# ============================================
networks:
  lucentmist-net:
    driver: bridge
